name: Sync Google Drive Assets

on:
  workflow_dispatch:
    inputs:
      folder_id:
        description: "Google Drive Ordner-ID (leer lassen, um das Secret GDRIVE_FOLDER_ID zu verwenden)"
        required: false
        type: string
      target_dir:
        description: "Zielordner im Repository, in den die Dateien heruntergeladen werden"
        required: false
        default: "."
        type: string
      commit_message:
        description: "Commit-Nachricht"
        required: false
        default: "Sync assets from Google Drive"
        type: string

permissions:
  contents: write

concurrency:
  group: sync-gdrive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdown
        run: pip install gdown

      - name: Download files from Google Drive
        env:
          INPUT_FOLDER_ID: ${{ inputs.folder_id }}
          SECRET_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          TARGET_DIR: ${{ inputs.target_dir }}
        run: |
          FOLDER_ID="${INPUT_FOLDER_ID:-$SECRET_FOLDER_ID}"
          if [ -z "$FOLDER_ID" ]; then
            echo "::error::Keine Ordner-ID angegeben (weder Input 'folder_id' noch Secret GDRIVE_FOLDER_ID)."
            exit 1
          fi
          mkdir -p "$TARGET_DIR"
          gdown --folder "https://drive.google.com/drive/folders/$FOLDER_ID" \
            --output "$TARGET_DIR"

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Convert audio files to mp3
        env:
          TARGET_DIR: ${{ inputs.target_dir }}
        run: |
          find "$TARGET_DIR" -type f \
            \( -iname '*.wav' -o -iname '*.ogg' -o -iname '*.flac' -o -iname '*.aiff' -o -iname '*.m4a' -o -iname '*.aac' \) \
            -not -path '*/.git/*' -print0 |
          while IFS= read -r -d '' f; do
            out="${f%.*}.mp3"
            echo "Konvertiere: $f -> $out"
            ffmpeg -y -hide_banner -loglevel error -i "$f" -codec:a libmp3lame -q:a 2 "$out"
            rm -- "$f"
          done

      - name: Commit and push changes
        env:
          TARGET_DIR: ${{ inputs.target_dir }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_DIR"
          if git diff --cached --quiet; then
            echo "Keine Änderungen — nichts zu committen."
            exit 0
          fi
          git commit -m "$COMMIT_MESSAGE"
          git push
