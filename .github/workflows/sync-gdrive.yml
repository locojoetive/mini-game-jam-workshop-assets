name: Sync Google Drive Assets

on:
  workflow_dispatch:
    inputs:
      folder_id:
        description: "Google Drive Ordner-ID (leer lassen, um das Secret GDRIVE_FOLDER_ID zu verwenden)"
        required: false
        type: string
      target_dir:
        description: "Zielordner im Repository, in den die Dateien heruntergeladen werden"
        required: false
        default: "."
        type: string
      commit_message:
        description: "Commit-Nachricht"
        required: false
        default: "Sync assets from Google Drive"
        type: string

permissions:
  contents: write

concurrency:
  group: sync-gdrive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdown
        run: pip install gdown

      - name: Download files from Google Drive
        env:
          INPUT_FOLDER_ID: ${{ inputs.folder_id }}
          SECRET_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          TARGET_DIR: ${{ inputs.target_dir }}
        run: |
          FOLDER_ID="${INPUT_FOLDER_ID:-$SECRET_FOLDER_ID}"
          if [ -z "$FOLDER_ID" ]; then
            echo "::error::Keine Ordner-ID angegeben (weder Input 'folder_id' noch Secret GDRIVE_FOLDER_ID)."
            exit 1
          fi
          mkdir -p "$TARGET_DIR"
          python .github/actions/process-assets/download_gdrive_parallel.py "$FOLDER_ID" "$TARGET_DIR"

      - name: Process and commit assets
        uses: ./.github/actions/process-assets
        with:
          target_dir: ${{ inputs.target_dir }}
          commit_message: ${{ inputs.commit_message }}
