name: Sync Assets

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: "Download-URL für das Asset-Archiv (leer lassen, um das Secret ASSET_DOWNLOAD_URL zu verwenden)"
        required: false
        type: string
      target_dir:
        description: "Zielordner im Repository, in den die Dateien heruntergeladen werden"
        required: false
        default: "."
        type: string
      commit_message:
        description: "Commit-Nachricht"
        required: false
        default: "Sync assets"
        type: string

permissions:
  contents: write

concurrency:
  group: sync-assets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and extract asset archive
        env:
          INPUT_DOWNLOAD_URL: ${{ inputs.download_url }}
          SECRET_DOWNLOAD_URL: ${{ secrets.ASSET_DOWNLOAD_URL }}
          TARGET_DIR: ${{ inputs.target_dir }}
        run: |
          DOWNLOAD_URL="${INPUT_DOWNLOAD_URL:-$SECRET_DOWNLOAD_URL}"
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::Keine Download-URL angegeben (weder Input 'download_url' noch Secret ASSET_DOWNLOAD_URL)."
            exit 1
          fi
          mkdir -p "$TARGET_DIR"
          archive="$(mktemp --suffix=.zip)"
          extract_dir="$(mktemp -d)"
          curl -fsSL "$DOWNLOAD_URL" -o "$archive"
          unzip -o -q "$archive" -d "$extract_dir"
          rm -f "$archive"

          src_dir="$extract_dir/Mini Game Jam Workshop"
          if [ ! -d "$src_dir" ]; then
            echo "::error::Ordner 'Mini Game Jam Workshop' nicht im Archiv gefunden."
            exit 1
          fi
          for folder in Musik Bilder SoundEffekte; do
            if [ ! -d "$src_dir/$folder" ]; then
              echo "Ordner '$folder' nicht in 'Mini Game Jam Workshop' gefunden — überspringe."
              continue
            fi
            rm -rf "${TARGET_DIR:?}/$folder"
            cp -r "$src_dir/$folder" "$TARGET_DIR/$folder"
          done
          rm -rf "$extract_dir"

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Convert audio files to mp3
        env:
          TARGET_DIR: ${{ inputs.target_dir }}
        run: |
          find "$TARGET_DIR" -type f \
            \( -iname '*.wav' -o -iname '*.ogg' -o -iname '*.flac' -o -iname '*.aiff' -o -iname '*.m4a' -o -iname '*.aac' \) \
            -not -path '*/.git/*' -print0 |
          while IFS= read -r -d '' f; do
            out="${f%.*}.mp3"
            echo "Konvertiere: $f -> $out"
            ffmpeg -y -nostdin -hide_banner -loglevel error -i "$f" -codec:a libmp3lame -q:a 2 "$out"
            rm -- "$f"
          done

      - name: Trim trailing silence from audio files
        env:
          TARGET_DIR: ${{ inputs.target_dir }}
        run: |
          # Trim trailing silence (e.g. GarageBand exports padded to the beat grid).
          # Leading silence is trimmed by hand in GarageBand before export.
          find "$TARGET_DIR" -type f -iname '*.mp3' \
            -not -path '*/.git/*' -print0 |
          while IFS= read -r -d '' f; do
            tmp="${f%.mp3}.trimmed.mp3"
            echo "Trimme Stille: $f"
            ffmpeg -y -nostdin -hide_banner -loglevel error -i "$f" -codec:a libmp3lame -q:a 4 -af "silenceremove=stop_periods=1:stop_duration=0.1:stop_threshold=-45dB" "$tmp"
            mv -f "$tmp" "$f"
          done

      - name: Commit and push changes
        env:
          TARGET_DIR: ${{ inputs.target_dir }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Add .mp3 and .png files, ignoring errors if no files match the pathspec
          git add "$TARGET_DIR/**/*.mp3" || true
          git add "$TARGET_DIR/**/*.png" || true
          
          if git diff --cached --quiet; then
            echo "Keine Änderungen — nichts zu committen."
            exit 0
          fi
          git commit -m "$COMMIT_MESSAGE"
          git push
